services:
  php:
    image: splitshare-app:latest
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://splitshare.jmgaming.site
      ASSET_URL: https://splitshare.jmgaming.site
      SESSION_PATH: /
    volumes:
      # PHP and Nginx must read one shared Vite manifest/build. Keeping this
      # mounted avoids PHP rendering a new entry file while Nginx serves an old
      # hashed JavaScript release.
      - ./public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks: [splitshare]

  queue:
    image: splitshare-app:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --queue=realtime,default,notifications --sleep=1 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks: [splitshare]

  scheduler:
    image: splitshare-app:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks: [splitshare]

  reverb:
    image: splitshare-app:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    networks: [splitshare]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [php, reverb]
    # Child-system port: the existing ALAS/server proxy owns public :80/:443.
    # It forwards the SplitShare subdomain to this loopback-only port.
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [splitshare]

networks:
  splitshare:
    driver: bridge
