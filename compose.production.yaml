services:
  php:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks: [splitshare]

  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --sleep=2 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on: [db]
    networks: [splitshare]

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on: [db]
    networks: [splitshare]

  reverb:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on: [db]
    networks: [splitshare]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [php, reverb]
    # Child-system port: the existing ALAS/server proxy owns public :80/:443.
    # It forwards the SplitShare subdomain to this loopback-only port.
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [splitshare]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [splitshare]

networks:
  splitshare:
    driver: bridge

volumes:
  postgres-data:
