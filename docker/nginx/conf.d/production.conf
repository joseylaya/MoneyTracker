server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 16m;

    location = /build/manifest.webmanifest { default_type application/manifest+json; }

    # Vite is built with a root base path while Laravel stores the compiled files
    # under public/build. Keep the public URLs stable for the web app and PWA.
    location ^~ /assets/ { alias /var/www/html/public/build/assets/; }
    # The browser must revalidate this stable worker entry on every app launch;
    # the imported build worker has a release marker and can then refresh its
    # hashed precache without leaving an old app shell behind.
    location = /service-worker.js {
        alias /var/www/html/public/service-worker.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.webmanifest { alias /var/www/html/public/build/manifest.webmanifest; default_type application/manifest+json; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Laravel Reverb WebSocket endpoint. TLS is terminated by the server proxy/CDN.
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
    }
    location ~ /\. { deny all; }
}
